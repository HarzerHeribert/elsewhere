# Apply only after choosing the workspace/region and reviewing paid resource creation.
# Auto-deploy is off: the operator promotes an exact tested main commit.
services:
  - type: web
    name: elsewhere-runtime
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SIMULATION_RATE
        value: '1'
      - key: MODEL_PROVIDER
        value: local
      - key: ALLOW_NEW_LIFE
        value: 'false'
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: API_PROXY_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elsewhere-state
          property: connectionString
databases:
  - name: elsewhere-state
    databaseName: elsewhere
    user: elsewhere
    region: frankfurt
    plan: 0.1c-256mb
    ipAllowList: []
