# Private metasearch: only the authenticated research gateway can reach this container.
use_default_settings:
  engines:
    keep_only: [duckduckgo, brave, bing, wikipedia]
general:
  instance_name: Elsewhere private research
search:
  safe_search: 1
  formats: [json]
server:
  bind_address: '0.0.0.0'
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  request_timeout: 4.0
  max_request_timeout: 6.0
  pool_connections: 4
  pool_maxsize: 4
engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false
