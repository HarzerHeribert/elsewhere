# Opt-in replacement Blueprint for personally hosted Hubert + private inference.
# Applying this creates a second paid service and a disk. It is never auto-applied.
# Update the existing Blueprint path rather than creating duplicate world/database resources.
services:
  - type: pserv
    name: elsewhere-inference
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/inference.mjs
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: 'off'
    disk:
      name: elsewhere-inference-private
      mountPath: /var/lib/elsewhere-inference
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '4100'
      - key: INFERENCE_DATA_ROOT
        value: /var/lib/elsewhere-inference
      - key: INFERENCE_BROKER_TOKEN
        generateValue: true
      - key: HUBERT_OWNER_USER_ID
        sync: false
      - key: MODEL_NAME
        value: gpt-6-luna
      - key: MODEL_MAX_CALLS_PER_DAY
        value: '150'
      - key: MODEL_MAX_CALLS_PER_HOUR
        value: '30'
      - key: MODEL_TIMEOUT_MS
        value: '30000'
      - key: CHATGPT_PROFILE
        value: default
  - type: web
    name: elsewhere-runtime
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SIMULATION_RATE
        value: '1'
      - key: MODEL_PROVIDER
        value: broker
      - key: MODEL_MAX_CALLS_PER_DAY
        value: '150'
      - key: MODEL_MAX_CALLS_PER_HOUR
        value: '30'
      - key: MODEL_TIMEOUT_MS
        value: '40000'
      - key: HUBERT_OWNER_USER_ID
        fromService:
          type: pserv
          name: elsewhere-inference
          envVarKey: HUBERT_OWNER_USER_ID
      - key: INFERENCE_BROKER_HOSTPORT
        fromService:
          type: pserv
          name: elsewhere-inference
          property: hostport
      - key: INFERENCE_BROKER_ALLOW_PRIVATE_HTTP
        value: 'true'
      - key: INFERENCE_BROKER_TOKEN
        fromService:
          type: pserv
          name: elsewhere-inference
          envVarKey: INFERENCE_BROKER_TOKEN
      - key: ALLOW_NEW_LIFE
        value: 'false'
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: API_PROXY_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elsewhere-state
          property: connectionString
databases:
  - name: elsewhere-state
    databaseName: elsewhere
    user: elsewhere
    region: frankfurt
    plan: 0.1c-256mb
    ipAllowList: []
