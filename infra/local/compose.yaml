services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elsewhere
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: elsewhere
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - elsewhere-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elsewhere -d elsewhere']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  elsewhere-postgres:
